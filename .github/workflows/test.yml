name: Run Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: amd64-runner

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read go version
        id: goversion
        run: echo "version=$(cat .go-version)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}

      - name: Build go
        run: go build

      - name: Vet
        run: go vet ./...

      # -race is not run in CI yet: it needs cgo and a C compiler on the
      # self-hosted runner, which this change does not assume.
      - name: Unit tests
        run: go test -count=1 ./...

      - name: Build Docker image
        run: make build

      - name: Build binaries
        run: make go-build-release
